name: Validar
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet test testes/Caixa.Tests/Caixa.Tests.csproj -c Release
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - shell: pwsh
        run: ./scripts/setup.ps1
      - name: Preparar imagem do Playwright
        run: |
          version="$(sed -n 's/^playwright==//p' requirements-testes.txt)"
          image="mcr.microsoft.com/playwright/python:v${version}-noble"
          docker pull "$image"
          echo "PLAYWRIGHT_IMAGE=$image" >> "$GITHUB_ENV"
      - run: docker compose up -d --build
      - shell: pwsh
        run: ./scripts/caixa-testes.ps1 -Modo Integracao
      - name: Verificar o fluxo completo no navegador
        run: |
          docker run --rm --network host --ipc=host \
            --mount "type=bind,source=$PWD,target=/projeto,readonly" --workdir /projeto \
            "$PLAYWRIGHT_IMAGE" bash -ec 'python -m venv /tmp/caixa && /tmp/caixa/bin/pip install -r requirements-testes.txt && /tmp/caixa/bin/python testes/navegador.py'
      - if: ${{ failure() && hashFiles('.env') != '' }}
        run: docker compose logs --tail 50
      - if: ${{ always() && hashFiles('.env') != '' }}
        run: docker compose down --volumes
