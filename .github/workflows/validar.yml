name: Validar
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet test testes/Caixa.Tests/Caixa.Tests.csproj -c Release
      - run: python -m pip install -r requirements-docs.txt -r requirements-testes.txt
      - run: python -m mkdocs build --strict
      - name: Preparar Chromium para os testes de navegador
        run: python -m playwright install --with-deps chromium
      - shell: pwsh
        run: ./scripts/setup.ps1
      - run: docker compose up -d --build
      - shell: pwsh
        run: ./scripts/caixa-testes.ps1 -Modo Integracao
      - name: Verificar o fluxo completo no navegador
        run: python testes/navegador.py
      - if: ${{ failure() && hashFiles('.env') != '' }}
        run: docker compose logs --tail 50
      - if: ${{ always() && hashFiles('.env') != '' }}
        run: docker compose down --volumes
