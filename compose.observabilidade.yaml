services:
  web:
    environment: {OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"}
  lancamentos:
    environment: {OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"}
  consolidado:
    environment: {OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"}
  publicador:
    environment: {OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"}
  projetor:
    environment: {OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"}
  collector:
    image: otel/opentelemetry-collector-contrib:0.145.0
    volumes: ["./infra/observabilidade/collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
  jaeger:
    image: jaegertracing/jaeger:2.15.0
    ports: ["127.0.0.1:16686:16686"]
  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports: ["127.0.0.1:15341:80"]
    volumes: ["seq-data:/data"]
  prometheus:
    image: prom/prometheus:v3.9.1
    volumes: ["./infra/observabilidade/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.3.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports: ["127.0.0.1:13000:3000"]
    volumes:
      - ./infra/observabilidade/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
volumes:
  seq-data:
  grafana-data:
